# AWS App Runner configuration (used only by the AWS version of this exercise, see aws/readme.md)
version: 1.0
runtime: python311
build:
  commands:
    build:
      - pip3 install -r requirements.txt
run:
  runtime-version: 3.11
  pre-run:
    - pip3 install -r requirements.txt
  command: gunicorn --bind 0.0.0.0:8080 app:app
  env:
    - name: PYTHONUNBUFFERED
      value: "1"
  network:
    port: 8080
