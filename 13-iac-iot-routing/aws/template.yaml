AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Exercise 13 (AWS version): an S3 bucket for IoT telemetry and an AWS IoT rule that
  stores the messages with the MQTT user property level=storage in the bucket.

Parameters:
  ProjectName:
    Description: Prefix for the names of the resources (1-11 lowercase letters and digits)
    Type: String
    Default: contoso
    AllowedPattern: '[a-z][a-z0-9]{0,10}'

Resources:
  # The bucket for the telemetry (the name is generated by CloudFormation, so it is unique)
  ResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # Allow only encrypted (HTTPS) access to the bucket
  ResultsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ResultsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ResultsBucket.Arn
              - !Sub ${ResultsBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # The role of the rule: AWS IoT may only write objects to the bucket
  StorageRouteRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: iot.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: write-telemetry
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${ResultsBucket.Arn}/*

  # The rule (the counterpart of the IoT Hub route): select the messages with level=storage
  # and write each one to the bucket as a JSON file
  StorageRoute:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: !Sub ${ProjectName}_storage_route
      TopicRulePayload:
        AwsIotSqlVersion: '2016-03-23'
        RuleDisabled: false
        Sql: >-
          SELECT *, topic(2) AS device_id, timestamp() AS received_at
          FROM 'devices/+/messages/events/'
          WHERE get(get_user_properties('level'), 0) = 'storage'
        Actions:
          - S3:
              BucketName: !Ref ResultsBucket
              Key: ${topic(2)}/${parse_time("yyyy/MM/dd/HH/mm", timestamp())}/${newuuid()}.json
              RoleArn: !GetAtt StorageRouteRole.Arn

Outputs:
  BucketName:
    Description: Name of the S3 bucket with the telemetry
    Value: !Ref ResultsBucket
  RuleName:
    Description: Name of the AWS IoT rule
    Value: !Ref StorageRoute
